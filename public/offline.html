<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline — BiG-Log</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, sans-serif; background: #EFEDE3; color: #2C322A; padding: 2rem; }
        .box { text-align: center; max-width: 22rem; }
        img { width: 64px; height: 64px; margin-bottom: 1rem; }
        h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
        p { font-size: .9rem; color: #5C6B4F; line-height: 1.5; }
        button { margin-top: 1.25rem; background: #5C6B4F; color: #EFEDE3; border: 0; border-radius: .5rem;
                 padding: .6rem 1.1rem; font-size: .85rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/gp-logo_192.png" alt="BiG-Log">
        <h1>Sei offline</h1>
        <p>BiG-Log ha bisogno della rete per mostrarti i dati aggiornati. Riprova quando torni online.</p>
        <button onclick="location.reload()">Riprova</button>
    </div>
</body>
</html>
